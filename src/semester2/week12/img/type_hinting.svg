<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="300" fill="#f9f9f9" />
  
  <text x="300" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">타입 힌팅 (Type Hinting)의 효과</text>
  
  <!-- Without Type Hinting -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="240" height="120" rx="10" fill="#fff" stroke="#d32f2f" stroke-width="2" />
    <text x="120" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#d32f2f">타입 힌트 없음</text>
    <text x="20" y="60" font-family="Arial" font-size="14" fill="#333">def add(a, b):</text>
    <text x="40" y="80" font-family="Arial" font-size="14" fill="#333">return a + b</text>
    <text x="20" y="110" font-family="Arial" font-size="12" fill="#d32f2f">⚠️ a, b가 무엇인지 알 수 없음</text>
  </g>
  
  <!-- With Type Hinting -->
  <g transform="translate(310, 80)">
    <rect x="0" y="0" width="240" height="120" rx="10" fill="#fff" stroke="#2e7d32" stroke-width="2" />
    <text x="120" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e7d32">타입 힌트 적용</text>
    <text x="20" y="60" font-//Arial" font-size="14" fill="#333">def add(a: int, b: int) -> int:</text>
    <text x="40" y="80" font-//Arial" font-size="14" fill="#333">return a + b</text>
    <text x="20" y="110" font-family="Arial" font-size="12" fill="#2e7d32">✅ 정수형 입력/출력임을 명시</text>
  </g>
  
  <!-- Mypy Tool -->
  <rect x="150" y="220" width="300" height="60" rx="10" fill="#e1f5fe" stroke="#01579b" stroke-width="2" />
  <text x="300" y="245" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#01579b">정적 분석 도구 (mypy)</text>
  <text x="300" y="265" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">실행 전 타입 오류를 미리 발견!</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>

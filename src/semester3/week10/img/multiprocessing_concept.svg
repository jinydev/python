<svg width="600" height="350" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="350" fill="#f9f9f9" />
  
  <text x="300" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">멀티프로세싱 (Multiprocessing) 구조</text>
  
  <!-- Process 1 -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#fff" stroke="#333" stroke-width="2" />
    <text x="110" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">프로세스 1 (CPU Core 1)</text>
    <rect x="30" y="50" width="160" height="60" rx="5" fill="#e1f5fe" stroke="#01579b" stroke-width="1" />
    <text x="110" y="85" font-family="Arial" font-size="14" text-anchor="middle" fill="#01579b">독립적 메모리 공간 &amp; GIL</text>
  </g>
  
  <!-- Process 2 -->
  <g transform="translate(330, 80)">
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#fff" stroke="#333" stroke-width="2" />
    <text x="110" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">프로세스 2 (CPU Core 2)</text>
    <rect x="30" y="50" width="160" height="60" rx="5" fill="#e1f5fe" stroke="#01579b" stroke-width="1" />
    <text x="110" y="85" font-family="Arial" font-size="14" text-anchor="middle" fill="#01579b">독립적 메모리 공간 &amp; GIL</text>
  </g>
  
  <!-- IPC -->
  <path d="M 270 150 L 330 150" stroke="#ef6c00" stroke-width="3" marker-end="url(#arrowhead)" />
  <path d="M 330 170 L 270 170" stroke="#ef6c00" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="300" y="140" font-family="Arial" font-size="14" text-anchor="middle" fill="#ef6c00">IPC (Inter-Process Communication)</text>
  <text x="300" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Queue, Pipe를 통한 데이터 교환</text>
  
  <rect x="150" y="250" width="300" height="60" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" />
  <text x="300" y="275" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ef6c00">CPU-bound 작업의 정답!</text>
  <text x="300" y="295" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">각 프로세스가 개별 GIL을 가져 진짜 병렬 실행</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>

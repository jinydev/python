<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="300" fill="#f9f9f9" />
  
  <text x="300" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">이진 탐색 (Binary Search) 과정</text>
  
  <!-- Array -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2" />
    <text x="25" y="30" font-family="Arial" font-size="16" text-anchor="middle">10</text>
    <rect x="50" y="0" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2" />
    <text x="75" y="30" font-family="Arial" font-size="16" text-anchor="middle">20</text>
    <rect x="100" y="0" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2" />
    <text x="125" y="30" font-family="Arial" font-size="16" text-anchor="middle">30</text>
    <rect x="150" y="0" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2" />
    <text x="175" y="30" font-family="Arial" font-size="16" text-anchor="middle">40</text>
    <rect x="200" y="0" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2" />
    <text x="225" y="30" font-family="Arial" font-size="16" text-anchor="middle">50</text>
    <rect x="250" y="0" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2" />
    <text x="275" y="30" font-family="Arial" font-size="16" text-anchor="middle">60</text>
    <rect x="300" y="0" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2" />
    <text x="325" y="30" font-family="Arial" font-size="16" text-anchor="middle">70</text>
  </g>
  
  <!-- Mid Point -->
  <path d="M 325 150 L 325 100" stroke="#ef6c00" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="335" y="130" font-family="Arial" font-size="14" fill="#ef6c00">중간값(Mid) 확인</text>
  
  <!-- Range Reduction -->
  <path d="M 50 160 L 300 160" stroke="#4caf50" stroke-width="4" marker-end="url(#arrowhead)" />
  <text x="175" y="180" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#4caf50">찾는 값이 작다면 왼쪽 절반만 탐색!</text>
  
  <text x="300" y="240" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">시간 복잡도: O(log n)</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>

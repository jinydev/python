<div class="my-4 text-center">
  <div class="d-inline-block text-start p-2 p-md-3 bg-white rounded-4 border shadow-sm" style="max-width: {{ include.max_width | default: '720px' }}; width: 100%;">
    <img src="{{ site.baseurl }}{{ include.src }}" alt="{{ include.alt | default: '파이썬 탐험대 삽화' }}" class="img-fluid rounded-3 mb-2 w-100" style="max-height: {{ include.max_height | default: '420px' }}; object-fit: cover;">
    {% if include.caption %}
      <div class="d-flex align-items-center justify-content-between px-1 mt-2 flex-wrap gap-2">
        <span class="small text-secondary fw-semibold">
          <i class="bi bi-palette-fill me-1 text-primary"></i>{{ include.caption }}
        </span>
        {% if include.character %}
          <span class="badge bg-light text-dark border small">{{ include.character }}</span>
        {% endif %}
      </div>
    {% endif %}
  </div>
</div>

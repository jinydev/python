<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="300" fill="#f9f9f9" />
  
  <text x="300" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">파이썬 패키징 흐름 (Packaging Flow)</text>
  
  <!-- Source Code -->
  <rect x="50" y="80" width="120" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="2" />
  <text x="110" y="115" font-family="Arial" font-size="14" text-anchor="middle">소스 코드 (.py)</text>
  
  <path d="M 170 110 L 230 110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="200" y="100" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Build</text>
  
  <!-- Wheel -->
  <rect x="230" y="80" width="120" height="60" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" />
  <text x="290" y="115" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ef6c00">Wheel (.whl)</text>
  
  <path d="M 350 110 L 410 110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="380" y="100" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Upload</text>
  
  <!-- PyPI -->
  <rect x="410" y="80" width="120" height="60" rx="10" fill="#e1f5fe" stroke="#01579b" stroke-width="2" />
  <text x="470" y="115" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#01579b">PyPI Repository</text>
  
  <!-- Config File -->
  <rect x="150" y="180" width="300" height="80" rx="10" fill="#fff" stroke="#333" stroke-width="1" />
  <text x="300" y="210" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">pyproject.toml</text>
  <text x="300" y="235" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">패키지 이름, 버전, 의존성, 빌드 시스템 정의</text>
  <text x="300" y="255" font-//Arial" font-size="14" text-anchor="middle" fill="#d32f2f">현대 파이썬 패키징의 표준 설정 파일</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>

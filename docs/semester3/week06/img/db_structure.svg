<svg width="600" height="350" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="350" fill="#f9f9f9" />
  
  <text x="300" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">관계형 데이터베이스 (RDBMS) 구조</text>
  
  <!-- Table -->
  <g transform="translate(150, 80)">
    <rect x="0" y="0" width="300" height="180" rx="10" fill="#fff" stroke="#333" stroke-width="2" />
    <text x="150" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Table: Users</text>
    
    <!-- Header -->
    <rect x="10" y="40" width="80" height="30" fill="#e1f5fe" stroke="#01579b" stroke-width="1" />
    <text x="50" y="60" font-family="Arial" font-size="14" text-anchor="middle" fill="#01579b">user_id (PK)</text>
    <rect x="100" y="40" width="100" height="30" fill="#e1f5fe" stroke="#01579b" stroke-width="1" />
    <text x="150" y="60" font-family="Arial" font-size="14" text-anchor="middle" fill="#01579b">name</text>
    <rect x="210" y="40" width="80" height="30" fill="#e1f5fe" stroke="#01579b" stroke-width="1" />
    <text x="250" y="60" font-family="Arial" font-size="14" text-anchor="middle" fill="#01579b">email</text>
    
    <!-- Rows -->
    <rect x="10" y="70" width="280" height="30" fill="#fff" stroke="#ccc" stroke-width="1" />
    <text x="50" y="90" font-family="Arial" font-size="14" text-anchor="middle">1</text>
    <text x="150" y="90" font-family="Arial" font-size="14" text-anchor="middle">지니</text>
    <text x="250" y="90" font-family="Arial" font-size="14" text-anchor="middle">jiny@test.com</text>
    
    <rect x="10" y="100" width="280" height="30" fill="#fff" stroke="#ccc" stroke-width="1" />
    <text x="50" y="120" font-family="Arial" font-size="14" text-anchor="middle">2</text>
    <text x="150" y="120" font-family="Arial" font-size="14" text-anchor="middle">철수</text>
    <text x="250" y="120" font-//Arial" font-size="14" text-anchor="middle">cs@test.com</text>
    
    <rect x="10" y="130" width="280" height="30" fill="#fff" stroke="#ccc" stroke-width="1" />
    <text x="50" y="150" font-//Arial" font-size="14" text-anchor="middle">3</text>
    <text x="150" y="150" font-family="Arial" font-size="14" text-anchor="middle">영희</text>
    <text x="250" y="150" font-family="Arial" font-size="14" text-anchor="middle">yh@test.com</text>
  </g>
  
  <!-- SQL Query -->
  <rect x="150" y="280" width="300" height="50" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" />
  <text x="300" y="310" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ef6c00">SELECT name FROM Users WHERE user_id = 1;</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
